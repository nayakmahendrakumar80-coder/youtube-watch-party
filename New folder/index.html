<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch Party Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }

    /* Lobby Screen */
    #lobbyScreen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 440px; margin-top: 30px; }
    h1 { margin-bottom: 24px; color: #ff0000; font-size: 1.5rem; text-align: center; }

    .card {
      background: #1e1e1e; border-radius: 12px; padding: 22px; width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-bottom: 20px;
    }
    .card-title {
      display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; color: #fff;
    }
    .card-title svg { width: 22px; height: 22px; fill: #ff0000; }
    .card p { color: #aaa; font-size: 0.85rem; margin-bottom: 12px; }

    .input-box {
      display: flex; align-items: center; background: #2a2a2a; border-radius: 8px;
      padding: 0 12px; border: 1px solid #333; margin-bottom: 12px;
    }
    .input-box svg { width: 18px; height: 18px; fill: #888; margin-right: 8px; }
    .input-box input {
      flex: 1; padding: 12px 0; border: none; background: transparent; color: #fff; font-size: 0.95rem; outline: none;
    }

    button.action-btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; background: #cc0000;
      color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button.action-btn:hover { background: #ff0000; }
    button.action-btn svg { width: 18px; height: 18px; fill: #fff; }
    .error-msg { color: #ff4d4d; font-size: 0.85rem; height: 16px; margin-top: 6px; }

    /* Player Interface */
    #playerScreen { display: none; width: 100%; max-width: 800px; flex-direction: column; align-items: center; }
    .room-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: #1e1e1e; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px;
    }
    .pin-badge { background: #cc0000; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; }
    .controls { margin-bottom: 14px; display: flex; gap: 8px; width: 100%; }
    .controls input {
      flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; outline: none;
    }
    .controls button {
      padding: 10px 18px; border-radius: 6px; border: none; background: #cc0000; color: #fff; font-weight: bold; cursor: pointer;
    }
    .controls button:hover { background: #ff0000; }

    .player-wrapper {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
      border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #player { width: 100%; height: 100%; }
    #mobileUnmuteOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10; cursor: pointer;
    }
    #mobileUnmuteOverlay span {
      background: #cc0000; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 1rem;
    }
    .status { margin-top: 12px; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>

  <!-- Lobby Interface -->
  <div id="lobbyScreen">
    <h1>YouTube Watch Party</h1>

    <!-- 1. Create Room Card with Icon -->
    <div class="card">
      <div class="card-title">
        <!-- Plus/Create Icon -->
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Create Separate Room
      </div>
      <p>Start a new session and generate a unique PIN for your friends.</p>
      <div class="input-box">
        <!-- Video Link Icon -->
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <input type="text" id="hostUrlInput" placeholder="Paste YouTube Link (Optional)" />
      </div>
      <button class="action-btn" onclick="hostRoom()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Generate Room & PIN
      </button>
    </div>

    <!-- 2. Join Room Card with Icon -->
    <div class="card">
      <div class="card-title">
        <!-- Key/Lock Icon -->
        <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        Join with PIN
      </div>
      <p>Enter the 4-digit PIN provided by your friend.</p>
      <div class="input-box">
        <!-- Search PIN Icon -->
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="number" id="joinPinInput" placeholder="Enter 4-Digit PIN" />
      </div>
      <button class="action-btn" onclick="joinRoom()">
        <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg>
        Join Room
      </button>
      <div class="error-msg" id="joinError"></div>
    </div>
  </div>

  <!-- Synchronized Player Screen -->
  <div id="playerScreen">
    <div class="room-header">
      <div>Room PIN: <span class="pin-badge" id="activePinDisplay">----</span></div>
      <span style="font-size: 0.85rem; color: #aaa;">Share this PIN to let others join</span>
    </div>

    <div class="controls">
      <input type="text" id="changeUrlInput" placeholder="Paste YouTube link to change video" />
      <button onclick="changeVideo()">Change Video</button>
    </div>

    <div class="player-wrapper">
      <div id="player"></div>
      <div id="mobileUnmuteOverlay" onclick="enableMobileAudio()">
        <span>▶ Tap to Start Video</span>
      </div>
    </div>

    <div class="status" id="statusText">Room Synced</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const socket = io();
    let player;
    let isProgrammaticChange = false;
    let currentVideoId = '';
    let isPlayerLoaded = false;

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    function hostRoom() {
      const input = document.getElementById('hostUrlInput').value.trim();
      const videoId = input ? extractVideoId(input) : 'dQw4w9WgXcQ';
      socket.emit('create_room', { videoId });
    }

    function joinRoom() {
      const pin = document.getElementById('joinPinInput').value.trim();
      if (!pin) return;
      socket.emit('join_room', pin);
    }

    socket.on('room_created', (data) => openPlayerView(data.pin, data.roomState.videoId));
    socket.on('room_joined', (data) => openPlayerView(data.pin, data.roomState.videoId));
    socket.on('join_error', (msg) => document.getElementById('joinError').innerText = msg);

    function openPlayerView(pin, videoId) {
      currentVideoId = videoId;
      document.getElementById('activePinDisplay').innerText = pin;
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('playerScreen').style.display = 'flex';
      initYouTubePlayer();
    }

    function initYouTubePlayer() {
      if (isPlayerLoaded && player && player.loadVideoById) {
        player.loadVideoById(currentVideoId, 0);
        return;
      }

      player = new YT.Player('player', {
        videoId: currentVideoId,
        playerVars: { 'playsinline': 1, 'enablejsapi': 1, 'rel': 0, 'origin': window.location.origin },
        events: {
          'onReady': () => {
            document.getElementById('statusText').innerText = 'Room Connected & Synced';
            if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
              document.getElementById('mobileUnmuteOverlay').style.display = 'flex';
            }
          },
          'onStateChange': onPlayerStateChange
        }
      });
      isPlayerLoaded = true;
    }

    function enableMobileAudio() {
      document.getElementById('mobileUnmuteOverlay').style.display = 'none';
      player.playVideo();
    }

    function onPlayerStateChange(event) {
      if (isProgrammaticChange) {
        isProgrammaticChange = false;
        return;
      }
      const currentTime = player.getCurrentTime();
      if (event.data === YT.PlayerState.PLAYING) {
        document.getElementById('mobileUnmuteOverlay').style.display = 'none';
        socket.emit('player_play', { currentTime });
      } else if (event.data === YT.PlayerState.PAUSED) {
        socket.emit('player_pause', { currentTime });
      }
    }

    function changeVideo() {
      const input = document.getElementById('changeUrlInput').value.trim();
      if (!input) return;
      const videoId = extractVideoId(input);
      socket.emit('change_video', { videoId });
      document.getElementById('changeUrlInput').value = '';
    }

    socket.on('player_play', (data) => {
      if (!player || !player.playVideo) return;
      isProgrammaticChange = true;
      if (Math.abs(player.getCurrentTime() - data.currentTime) > 1.5) {
        player.seekTo(data.currentTime, true);
      }
      player.playVideo();
    });

    socket.on('player_pause', (data) => {
      if (!player || !player.pauseVideo) return;
      isProgrammaticChange = true;
      player.seekTo(data.currentTime, true);
      player.pauseVideo();
    });

    socket.on('player_seek', (data) => {
      if (!player || !player.seekTo) return;
      isProgrammaticChange = true;
      player.seekTo(data.currentTime, true);
    });

    socket.on('change_video', (data) => {
      if (!player || !player.loadVideoById) return;
      isProgrammaticChange = true;
      currentVideoId = data.videoId;
      player.loadVideoById(data.videoId, 0);
    });
  </script>
</body>
</html>
